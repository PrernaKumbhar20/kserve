[project]
authors = [
    {name = "Zhengyuan Zhang", email = "zhangzhengyuan0604@gmail.com"},
]
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.12"
dependencies = [
    "kserve @ file:///${PROJECT_ROOT}/../kserve",
    "kserve-storage @ file:///${PROJECT_ROOT}/../storage",
    "paddlepaddle==3.0.0; platform_system != 'Windows' and platform_machine != 'ppc64le'",
    "paddlepaddle==3.0.0; platform_system != 'Windows' and platform_machine == 'ppc64le'",
    "setuptools<71.0.0,>=70.0.0",
]
name = "paddleserver"
version = "0.18.0"
description = "Model Server implementation for Paddle. Not intended for use outside KServe Frameworks Images"
readme = "README.md"

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.4.4",
    "pytest-cov<6.0.0,>=5.0.0",
    "mypy<1.0,>=0.991",
    "opencv-python<5.0.0,>=4.10.0",
]
dev = [
    "black[colorama]~=24.3.0",
]


[tool.uv]
index-strategy = "unsafe-best-match"
environments = ["platform_machine == 'ppc64le' and sys_platform == 'linux'"]
# TODO remove later
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "localindex-wheels"
url = "http://140.211.168.199:8000/"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# UV workspace source for local dependency resolution
[tool.uv.sources]
kserve-storage = { path = "../storage", editable = true }

paddlepaddle = [
    { index = "pypi", marker = "platform_machine != 'ppc64le'" },
    { index = "localindex-wheels", marker = "platform_machine == 'ppc64le'" },
]
